<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AstroBase: Junior Mission Commander. Keep five astronauts alive for 30 days on Mars or the Moon."
    />
    <meta name="theme-color" content="#0B1020" />
    <title>AstroBase: Junior Mission Commander</title>
    <script>
      // Apply the saved theme before first paint so light mode never flashes dark.
      (function () {
        var theme = 'system';
        try {
          theme = JSON.parse(localStorage.getItem('astrobase.settings.v1') || '{}').theme || 'system';
        } catch (e) {}
        if (theme === 'system')
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        if (theme === 'light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F1F4FA');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
